<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz SIM – Parcial 1</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', sans-serif;
    background: #0f1117;
    color: #e0e0e0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 30px 16px;
  }
  h1 {
    font-size: 1.6rem;
    color: #7c9dff;
    margin-bottom: 6px;
    text-align: center;
  }
  #progress-bar-wrap {
    width: 100%;
    max-width: 700px;
    background: #1e2130;
    border-radius: 99px;
    height: 8px;
    margin: 12px 0 4px;
    overflow: hidden;
  }
  #progress-bar {
    height: 100%;
    background: linear-gradient(90deg, #4f7cff, #a78bfa);
    border-radius: 99px;
    transition: width .4s ease;
    width: 0%;
  }
  #progress-text {
    font-size: .82rem;
    color: #888;
    margin-bottom: 20px;
  }
  #card {
    background: #1a1e2e;
    border: 1px solid #2a2f45;
    border-radius: 16px;
    padding: 28px 28px 22px;
    max-width: 700px;
    width: 100%;
    box-shadow: 0 8px 40px rgba(0,0,0,.4);
  }
  #question-title {
    font-size: .7rem;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: #5a6a9a;
    margin-bottom: 8px;
  }
  #question-text {
    font-size: 1.05rem;
    line-height: 1.5;
    margin-bottom: 20px;
    color: #d8ddf5;
  }
  #hint {
    font-size: .78rem;
    color: #6677aa;
    margin-bottom: 14px;
  }
  .option-label {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    background: #22273a;
    border: 1px solid #2e3450;
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 9px;
    cursor: pointer;
    transition: border-color .2s, background .2s;
    user-select: none;
  }
  .option-label:hover { border-color: #4f7cff; background: #272d44; }
  .option-label input[type=checkbox] { display: none; }
  .check-box {
    width: 18px; height: 18px;
    border: 2px solid #4a5278;
    border-radius: 5px;
    flex-shrink: 0;
    margin-top: 2px;
    display: flex; align-items: center; justify-content: center;
    transition: background .2s, border-color .2s;
  }
  .option-label.selected .check-box {
    background: #4f7cff;
    border-color: #4f7cff;
  }
  .option-label.selected .check-box::after { content: '✓'; color: #fff; font-size: 11px; }
  /* resultado */
  .option-label.correct   { border-color: #34d399; background: #0d2e22; }
  .option-label.incorrect { border-color: #f87171; background: #2e1010; }
  .option-label.missed    { border-color: #facc15; background: #2a2000; }
  .option-label.correct   .check-box { background: #34d399; border-color: #34d399; }
  .option-label.incorrect .check-box { background: #f87171; border-color: #f87171; }
  .option-label.missed    .check-box { background: #facc15; border-color: #facc15; }
  .option-label.correct   .check-box::after,
  .option-label.incorrect .check-box::after,
  .option-label.missed    .check-box::after { color: #000; font-size: 11px; }
  .option-label.incorrect .check-box::after { content: '✗'; color: #fff; }
  .option-label.missed    .check-box::after { content: '!'; }
  .legend {
    font-size: .73rem;
    margin-top: 4px;
    padding-left: 4px;
  }
  .option-text { font-size: .94rem; line-height: 1.4; }
  #result-msg {
    margin-top: 16px;
    padding: 12px 16px;
    border-radius: 10px;
    font-size: .9rem;
    display: none;
  }
  #result-msg.ok  { background: #0d2e22; border: 1px solid #34d399; color: #6ee7b7; }
  #result-msg.bad { background: #2e1010; border: 1px solid #f87171; color: #fca5a5; }
  .btn-row { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
  button {
    padding: 10px 22px;
    border: none;
    border-radius: 10px;
    font-size: .9rem;
    font-weight: 600;
    cursor: pointer;
    transition: opacity .2s, transform .1s;
  }
  button:hover { opacity: .88; transform: translateY(-1px); }
  #btn-confirm { background: linear-gradient(135deg, #4f7cff, #a78bfa); color: #fff; }
  #btn-next    { background: #22273a; color: #aab; border: 1px solid #3a4060; display: none; }
  #btn-restart { background: #1a1e2e; color: #7c9dff; border: 1px solid #3a4060; display: none; }

  /* pantalla final */
  #end-screen {
    background: #1a1e2e;
    border: 1px solid #2a2f45;
    border-radius: 16px;
    padding: 40px 32px;
    max-width: 500px;
    width: 100%;
    text-align: center;
    display: none;
    box-shadow: 0 8px 40px rgba(0,0,0,.4);
  }
  #end-screen h2 { font-size: 1.5rem; margin-bottom: 10px; color: #7c9dff; }
  #score-text { font-size: 3rem; font-weight: 700; margin: 16px 0 6px; }
  #score-text.great { color: #34d399; }
  #score-text.ok    { color: #facc15; }
  #score-text.bad   { color: #f87171; }
  #score-detail { color: #888; font-size: .9rem; margin-bottom: 28px; }
  #btn-play-again {
    background: linear-gradient(135deg, #4f7cff, #a78bfa);
    color: #fff;
    padding: 12px 32px;
    font-size: 1rem;
  }

  /* ── TABS ── */
  .tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 22px;
    max-width: 700px;
    width: 100%;
  }
  .tab-btn {
    flex: 1;
    padding: 10px 0;
    border-radius: 10px;
    border: 1px solid #2e3450;
    background: #1a1e2e;
    color: #6677aa;
    font-size: .95rem;
    font-weight: 600;
    cursor: pointer;
    transition: all .2s;
  }
  .tab-btn.active {
    background: linear-gradient(135deg,#4f7cff,#a78bfa);
    color: #fff;
    border-color: transparent;
  }
  .tab-section { width: 100%; max-width: 700px; display: none; }
  .tab-section.active { display: block; }

  /* ── THEORY ── */
  #teo-nav { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px; }
  .teo-cat {
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid #2e3450;
    background: #1a1e2e;
    color: #7c9dff;
    font-size: .8rem;
    cursor: pointer;
    transition: all .2s;
  }
  .teo-cat.active { background:#4f7cff; color:#fff; border-color:#4f7cff; }

  .fc-wrap { perspective: 900px; width:100%; margin-bottom:16px; min-height:200px; }
  .fc {
    width: 100%;
    min-height: 200px;
    position: relative;
    transform-style: preserve-3d;
    transition: transform .5s ease;
    cursor: pointer;
  }
  .fc.flipped { transform: rotateY(180deg); }
  .fc-front, .fc-back {
    position: absolute; top:0; left:0; width:100%;
    backface-visibility: hidden;
    border-radius: 16px;
    padding: 28px 24px;
    box-shadow: 0 6px 30px rgba(0,0,0,.4);
    min-height: 200px;
    display: flex; flex-direction:column; justify-content:center;
  }
  .fc-front {
    background: #1a1e2e;
    border: 1px solid #2e3450;
  }
  .fc-back {
    background: linear-gradient(135deg,#0d1a3a,#1a1035);
    border: 1px solid #4f7cff;
    transform: rotateY(180deg);
  }
  .fc-tag {
    font-size:.68rem; text-transform:uppercase;
    letter-spacing:.1em; color:#5a6a9a; margin-bottom:10px;
  }
  .fc-q { font-size:1.1rem; color:#d8ddf5; line-height:1.5; }
  .fc-hint { font-size:.75rem; color:#4a5a8a; margin-top:14px; }
  .fc-a { font-size:.95rem; color:#c4d4ff; line-height:1.6; }
  .fc-emoji { font-size:2rem; margin-bottom:10px; }
  .fc-nav { display:flex; gap:10px; align-items:center; justify-content:space-between; margin-top:10px; }
  .fc-nav button {
    padding:8px 18px;
    background:#22273a;
    border:1px solid #3a4060;
    border-radius:8px;
    color:#aab;
    font-size:.88rem;
  }
  #fc-counter { color:#6677aa; font-size:.82rem; }
  .pill-list { display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
  .pill {
    background:#1e2540;
    border:1px solid #3a4a70;
    border-radius:20px;
    padding:4px 12px;
    font-size:.83rem;
    color:#a0b4f0;
  }
  .pill.green { border-color:#34d399; color:#6ee7b7; background:#0a2018; }
  .pill.red   { border-color:#f87171; color:#fca5a5; background:#200a0a; }
  .pill.yellow{ border-color:#facc15; color:#fde68a; background:#201800; }
  .two-col { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:8px; }
  .two-col .col-title { font-size:.72rem; text-transform:uppercase; letter-spacing:.08em; margin-bottom:4px; opacity:.7; }

  /* ── SINGLE choice (radio style) ── */
  .option-label.radio-opt { border-radius: 10px; }
  .option-label.radio-opt .check-box { border-radius: 50%; }
  .option-label.radio-opt.selected .check-box { background:#a78bfa; border-color:#a78bfa; }

  /* ── ORDER (input numérico) ── */
  .order-item {
    display:flex; align-items:center; gap:12px;
    background:#22273a; border:1px solid #2e3450;
    border-radius:10px; padding:10px 14px;
    margin-bottom:8px; transition:border-color .2s, background .2s;
  }
  .order-input {
    width:46px; height:36px;
    background:#0f1117; border:2px solid #3a4060;
    border-radius:8px; color:#7c9dff;
    font-size:1rem; font-weight:700;
    text-align:center; flex-shrink:0;
    outline:none; transition:border-color .2s;
  }
  .order-input:focus { border-color:#4f7cff; }
  .order-input:disabled { opacity:.6; cursor:default; }
  .order-item.correct-order { border-color:#34d399; background:#0d2e22; }
  .order-item.correct-order .order-input { border-color:#34d399; color:#34d399; }
  .order-item.wrong-order   { border-color:#f87171; background:#2e1010; }
  .order-item.wrong-order   .order-input { border-color:#f87171; color:#f87171; }
  .order-correct-label { font-size:.78rem; color:#6ee7b7; margin-left:4px; }
</style>
</head>
<body>

<h1>📚 SIM – Parcial 1</h1>

<div class="tabs">
  <button class="tab-btn active" onclick="switchTab('teo')">🧠 Teoría</button>
  <button class="tab-btn" onclick="switchTab('quiz')">🎮 Quiz</button>
</div>

<!-- ══════════════ SECCIÓN TEORÍA ══════════════ -->
<div class="tab-section active" id="tab-teo">
  <div id="teo-nav">
    <button class="teo-cat active" onclick="setTeocat(0,this)">🗂 Modelos</button>
    <button class="teo-cat" onclick="setTeocat(1,this)">⚙️ Simulación</button>
    <button class="teo-cat" onclick="setTeocat(2,this)">🔛 Terminantes</button>
    <button class="teo-cat" onclick="setTeocat(3,this)">➕➖ Ventajas/Desv.</button>
    <button class="teo-cat" onclick="setTeocat(4,this)">💻 Lenguajes</button>
    <button class="teo-cat" onclick="setTeocat(5,this)">🔟 Etapas</button>
    <button class="teo-cat" onclick="setTeocat(6,this)">✅ Validación</button>
    <button class="teo-cat" onclick="setTeocat(7,this)">📊 IC &amp; Muestra</button>
  </div>

  <div class="fc-wrap">
    <div class="fc" id="flashcard" onclick="flipCard()">
      <div class="fc-front">
        <div class="fc-tag" id="fc-tag"></div>
        <div class="fc-emoji" id="fc-emoji"></div>
        <div class="fc-q" id="fc-q"></div>
        <div class="fc-hint">👆 Click para ver la respuesta</div>
      </div>
      <div class="fc-back">
        <div class="fc-tag" id="fc-tag-back"></div>
        <div id="fc-a" class="fc-a"></div>
      </div>
    </div>
  </div>

  <div class="fc-nav">
    <button onclick="fcMove(-1)">← Anterior</button>
    <span id="fc-counter"></span>
    <button onclick="fcMove(1)">Siguiente →</button>
  </div>
</div>

<!-- ══════════════ SECCIÓN QUIZ ══════════════ -->
<div class="tab-section" id="tab-quiz">
<div id="progress-bar-wrap"><div id="progress-bar"></div></div>
<p id="progress-text">Pregunta 0 de 0</p>

<div id="card">
  <div id="question-title"></div>
  <div id="question-text"></div>
  <div id="hint"></div>
  <div id="options-container"></div>
  <div id="result-msg"></div>
  <div class="btn-row">
    <button id="btn-confirm">Confirmar respuesta</button>
    <button id="btn-next">Siguiente →</button>
    <button id="btn-restart">🔁 Reiniciar</button>
  </div>
</div>

<div id="end-screen">
  <h2>¡Quiz terminado!</h2>
  <div id="score-text"></div>
  <div id="score-detail"></div>
  <button id="btn-play-again">Jugar de nuevo 🚀</button>
</div>
</div><!-- /tab-quiz -->

let shuffledQ = [];
let currentIdx = 0;
let currentOptions = []; // opciones en orden aleatorio para la pregunta actual
let correctCount = 0;
let confirmed = false;

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function startQuiz() {
  shuffledQ = shuffle(QUESTIONS);
  currentIdx = 0;
  correctCount = 0;
  document.getElementById('end-screen').style.display = 'none';
  document.getElementById('card').style.display = 'block';
  document.getElementById('btn-restart').style.display = 'none';
  renderQuestion();
}


function renderQuestion() {
  confirmed = false;
  const q = shuffledQ[currentIdx];
  const total = shuffledQ.length;

  document.getElementById('progress-text').textContent = `Pregunta ${currentIdx + 1} de ${total}`;
  document.getElementById('progress-bar').style.width = `${((currentIdx) / total) * 100}%`;
  document.getElementById('question-title').textContent = `Pregunta ${currentIdx + 1} / ${total}`;
  document.getElementById('question-text').textContent = q.text;
  document.getElementById('result-msg').style.display = 'none';
  document.getElementById('btn-next').style.display = 'none';
  document.getElementById('btn-confirm').style.display = 'inline-block';

  const container = document.getElementById('options-container');
  container.innerHTML = '';

  if (q.type === 'order') {
    document.getElementById('hint').textContent = '✏️ Escribí el número de orden (1 a 10) en el cuadro de cada etapa';
    currentOptions = shuffle(q.options.map((text, idx) => ({ text, origIdx: idx })));
    currentOptions.forEach((opt, i) => {
      const div = document.createElement('div');
      div.className = 'order-item';
      div.dataset.i = i;
      const inp = document.createElement('input');
      inp.type = 'number'; inp.min = 1; inp.max = q.options.length;
      inp.className = 'order-input'; inp.id = `oinp_${i}`;
      inp.placeholder = '#';
      const span = document.createElement('span');
      span.className = 'option-text'; span.textContent = opt.text;
      div.appendChild(inp); div.appendChild(span);
      container.appendChild(div);
    });

  } else if (q.type === 'single') {
    document.getElementById('hint').textContent = 'Elegí UNA sola opción correcta';
    currentOptions = shuffle(q.options.map((text, idx) => ({ text, origIdx: idx })));
    currentOptions.forEach((opt, i) => {
      const label = document.createElement('label');
      label.className = 'option-label radio-opt';
      label.dataset.i = i;
      label.innerHTML = `<input type="radio" name="single" value="${i}"><span class="check-box"></span><span class="option-text">${opt.text}</span>`;
      label.addEventListener('click', (e) => {
        if (confirmed) return;
        e.preventDefault();
        document.querySelectorAll('.option-label.radio-opt').forEach(l => l.classList.remove('selected'));
        label.classList.add('selected');
      });
      container.appendChild(label);
    });

  } else {
    // multi
    const cnt = q.correct.length;
    document.getElementById('hint').textContent = `Seleccioná todas las que correspondan (${cnt} correctas)`;
    currentOptions = shuffle(q.options.map((text, idx) => ({ text, origIdx: idx })));
    currentOptions.forEach((opt, i) => {
      const label = document.createElement('label');
      label.className = 'option-label';
      label.dataset.i = i;
      label.innerHTML = `<input type="checkbox" value="${i}"><span class="check-box"></span><span class="option-text">${opt.text}</span>`;
      label.addEventListener('click', (e) => {
        if (confirmed) return;
        e.preventDefault();
        label.classList.toggle('selected');
      });
      container.appendChild(label);
    });
  }
}

document.getElementById('btn-confirm').addEventListener('click', () => {
  if (confirmed) return;
  confirmed = true;

  const q = shuffledQ[currentIdx];
  const msg = document.getElementById('result-msg');
  let allCorrect = true;

  if (q.type === 'order') {
    const items = [...document.querySelectorAll('.order-item')];
    // build a map: origIdx -> typed position (1-based)
    const typedPos = {}; // origIdx -> number entered
    let inputError = false;
    items.forEach((div, i) => {
      const inp = div.querySelector('.order-input');
      inp.disabled = true;
      const val = parseInt(inp.value);
      if (isNaN(val) || val < 1 || val > q.options.length) { inputError = true; return; }
      typedPos[currentOptions[i].origIdx] = val;
    });
    if (inputError) {
      confirmed = false; // allow retry
      document.getElementById('btn-confirm').style.display = 'inline-block';
      items.forEach(div => div.querySelector('.order-input').disabled = false);
      msg.textContent = '⚠️ Completá todos los números (1 a ' + q.options.length + ') antes de confirmar.';
      msg.className = 'result-msg bad'; msg.style.display = 'block';
      return;
    }
    // check each item: the typed position should equal (origIdx+1) since correct order is 0,1,2...
    items.forEach((div, i) => {
      const opt = currentOptions[i];
      const typed = typedPos[opt.origIdx]; // position user assigned to this item
      const expected = opt.origIdx + 1;    // correct position (1-based)
      if (typed === expected) {
        div.classList.add('correct-order');
      } else {
        div.classList.add('wrong-order');
        allCorrect = false;
        // show the correct number
        const lbl = document.createElement('span');
        lbl.className = 'order-correct-label';
        lbl.textContent = `→ era el ${expected}`;
        div.appendChild(lbl);
      }
    });
    if (allCorrect) {
      msg.textContent = '✅ ¡Orden perfecto!';
      msg.className = 'result-msg ok'; correctCount++;
    } else {
      msg.textContent = '❌ Algunos números estaban mal. Los correctos están en verde, los incorrectos en rojo con el número que correspondía.';
      msg.className = 'result-msg bad';
    }

  } else {
    // single & multi share same label-based logic
    const labels = document.querySelectorAll('.option-label');
    const correctOrigIdxSet = new Set(q.correct);
    labels.forEach(label => {
      const i = parseInt(label.dataset.i);
      const opt = currentOptions[i];
      const isSelected = label.classList.contains('selected');
      const isCorrect = correctOrigIdxSet.has(opt.origIdx);
      if (isSelected && isCorrect)       { label.classList.add('correct'); }
      else if (isSelected && !isCorrect) { label.classList.add('incorrect'); allCorrect = false; }
      else if (!isSelected && isCorrect) { label.classList.add('missed');    allCorrect = false; }
    });
    if (allCorrect) {
      msg.textContent = '✅ ¡Perfecto! Respuesta correcta.';
      msg.className = 'result-msg ok';
      correctCount++;
    } else {
      const lbls = [...labels];
      const sc = lbls.filter(l => l.classList.contains('correct')).length;
      const missed = lbls.filter(l => l.classList.contains('missed')).length;
      const wrong  = lbls.filter(l => l.classList.contains('incorrect')).length;
      msg.textContent = q.type === 'single'
        ? `❌ Incorrecto. La opción correcta está marcada en verde.`
        : `❌ Casi. Correctas: ${sc}/${q.correct.length}. Incorrectas: ${wrong}. Faltaron: ${missed}. 🟡=faltaban, 🔴=incorrectas, 🟢=correctas.`;
      msg.className = 'result-msg bad';
    }
  }

  msg.style.display = 'block';
  document.getElementById('btn-confirm').style.display = 'none';
  const isLast = currentIdx === shuffledQ.length - 1;
  document.getElementById('btn-next').textContent = isLast ? 'Ver resultados finales →' : 'Siguiente →';
  document.getElementById('btn-next').style.display = 'inline-block';
});

document.getElementById('btn-next').addEventListener('click', () => {
  currentIdx++;
  if (currentIdx >= shuffledQ.length) {
    showEndScreen();
  } else {
    renderQuestion();
  }
});

document.getElementById('btn-restart').addEventListener('click', startQuiz);
document.getElementById('btn-play-again').addEventListener('click', startQuiz);

function showEndScreen() {
  document.getElementById('card').style.display = 'none';
  document.getElementById('end-screen').style.display = 'block';
  const total = shuffledQ.length;
  const pct = Math.round((correctCount / total) * 100);
  const scoreEl = document.getElementById('score-text');
  scoreEl.textContent = `${correctCount} / ${total}`;
  scoreEl.className = pct >= 80 ? 'great' : pct >= 50 ? 'ok' : 'bad';
  document.getElementById('score-detail').textContent =
    `${pct}% de respuestas perfectas. ${pct >= 80 ? '¡Excelente trabajo! 🎉' : pct >= 50 ? 'Bien, pero podés mejorar 💪' : 'Seguí estudiando, vos podés 📚'}`;
  document.getElementById('progress-bar').style.width = '100%';
  document.getElementById('progress-text').textContent = `Completado: ${total} de ${total}`;
}
