<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego de Práctica - Gestión TI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f3f4f6;
        }
        .fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .btn-option {
            transition: all 0.2s;
        }
        .btn-option:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen flex items-center justify-center p-4 text-slate-800">

    <div id="app" class="w-full max-w-3xl bg-white rounded-2xl shadow-xl overflow-hidden relative">
        
        <!-- PANTALLA DE INICIO -->
        <div id="start-screen" class="p-8 text-center fade-in">
            <div class="mb-6 flex justify-center">
                <div class="bg-indigo-100 p-4 rounded-full text-indigo-600">
                    <svg class="w-16 h-16" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"></path></svg>
                </div>
            </div>
            <h1 class="text-3xl font-bold text-slate-800 mb-4">Simulador de Examen</h1>
            <p class="text-slate-600 mb-8">Practica las 62 preguntas de Gestión y Gobierno de TI. Las preguntas y opciones aparecerán de forma aleatoria.</p>
            <button onclick="iniciarJuego(todasLasPreguntas)" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-8 rounded-xl shadow-lg transition-colors text-lg w-full sm:w-auto">
                Comenzar Práctica
            </button>
        </div>

        <!-- PANTALLA DE JUEGO -->
        <div id="game-screen" class="hidden flex-col h-full fade-in">
            <!-- Header & Progress -->
            <div class="bg-indigo-600 p-4 text-white flex justify-between items-center shadow-md">
                <span id="progress-text" class="font-semibold">Pregunta 1 de 62</span>
                <span id="score-text" class="bg-indigo-800 px-3 py-1 rounded-lg text-sm font-bold">Aciertos: 0</span>
            </div>
            <div class="w-full bg-indigo-200 h-2">
                <div id="progress-bar" class="bg-green-400 h-2 transition-all duration-300" style="width: 0%;"></div>
            </div>

            <!-- Question Area -->
            <div class="p-6 md:p-8 flex-grow">
                <h2 id="question-text" class="text-xl md:text-2xl font-bold text-slate-800 mb-6 leading-snug">
                    ¿Pregunta?
                </h2>
                
                <div id="options-container" class="flex flex-col space-y-3">
                    <!-- Opciones inyectadas por JS -->
                </div>
            </div>

            <!-- Footer / Next Button -->
            <div class="p-6 bg-gray-50 border-t border-gray-100 flex justify-end">
                <button id="next-btn" onclick="siguientePregunta()" class="hidden bg-slate-800 hover:bg-slate-900 text-white font-bold py-3 px-6 rounded-xl shadow transition-colors">
                    Siguiente Pregunta ➔
                </button>
            </div>
        </div>

        <!-- PANTALLA DE RESULTADOS -->
        <div id="result-screen" class="hidden p-8 text-center fade-in">
            <div id="result-icon" class="mb-6 flex justify-center">
                <!-- Icono inyectado por JS -->
            </div>
            <h2 id="result-title" class="text-3xl font-bold text-slate-800 mb-2">¡Ronda Terminada!</h2>
            <p id="result-score" class="text-xl text-slate-600 mb-8">Obtuviste X de Y correctas.</p>
            
            <div class="flex flex-col sm:flex-row justify-center space-y-3 sm:space-y-0 sm:space-x-4">
                <button id="retry-mistakes-btn" onclick="practicarErrores()" class="hidden bg-orange-500 hover:bg-orange-600 text-white font-bold py-3 px-6 rounded-xl shadow-lg transition-colors">
                    Practicar las que me equivoqué
                </button>
                <button onclick="iniciarJuego(todasLasPreguntas)" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-6 rounded-xl shadow-lg transition-colors">
                    Reiniciar todo
                </button>
            </div>
        </div>

    </div>

    <script>
        // BASE DE DATOS DE PREGUNTAS (Adaptadas del texto proporcionado)
        const todasLasPreguntas = [
            {
                q: "1. Cuál de los siguientes, son desafíos para los CIOs",
                options: ["Las opciones a, c y e son correctas", "Mejorar la relacion entre TI y sus clientes", "Registrar las fallas de los sistemas para identificar causas", "Todas las opciones son correctas", "Las opciones a, b y g"],
                ans: "Las opciones a, c y e son correctas"
            },
            {

            },
            {
                q: "3. La jerarquía de necesidades de Maslow se basa en que el hombre demuestra sus necesidades en el transcurso de la vida, identificando:",

            },
            {
                q: "4. En la Higiene en el trabajo, qué variables se deben controlar :",

            },
            {
                q: "5. ¿Cuál es el concepto de administración de salarios?",

            },
            {
                q: "8. Estrategia de TI:",
                options: [
                    "Es un plan integrado (visión/misión, iniciativas, riesgos) y su ejecución incluye la operación de servicios TI.",
                    "En ausencia de un CIO, el equipo de TI puede definir una estrategia de TI efectiva únicamente.",
                    "Solo incluye la evaluación del estado actual sin mirar hacia el futuro.",
                    "No incluye la operación de servicios TI en su ejecución."

            },
            {
                q: "12. En relación a una Mesa de Servicios:",
                options: [
                    "Las herramientas ITSM son esenciales para automatizar procesos y la disponibilidad es crítica.",

            {
                q: "13. La Gestión se refiere a la implementación de criterios de toma de decisión en el uso de sistemas de TI, su arquitectura y la creación y explotación de activos TI para cubrir las necesidades actuales y futuras del negocio.",

                ans: "La Gestión TI se focaliza en la eficiencia operativa y el Gobierno TI en las decisiones estratégicas TI"
            },
            {
                q: "15. Las 3 funciones principales de TI son:",
                options: ["Infraestructura, Funcionalidad y Gobernanza", "Soporte, Funcionalidad y Gobernanza", "Soporte, Desarrollo y Toma de decisiones", "Ninguna de las opciones anteriores es correcta"],

            },
            {
                q: "18. Según las nuevas formas de Organizaciones, relacionar:",
                options: [
                    "Org 4.0 (horizontal por funciones), Planas (sin cargos), Virtuales (Outsourcing/Digitalización), Flatarchies (jerárquica + equipos plana)",
                    "Todas combinan estructura jerárquica rígida con control estricto de horarios.",
                    "Org 4.0 (jerárquica pura), Planas (Outsourcing total), Virtuales (sin roles)",
                    "Ninguna de las anteriores relaciona correctamente los conceptos."
                ],
                ans: "Org 4.0 (horizontal por funciones), Planas (sin cargos), Virtuales (Outsourcing/Digitalización), Flatarchies (jerárquica + equipos plana)"
            },
            {
                q: "19. En relación a una Mesa de Servicios:",
                options: [
                    "Los SLA son parte del catálogo de servicios TI y la madurez ITSM es un concepto clave.",
                    "La mesa de servicios de TI no tiene relación con los usuarios.",
                    "Las incidencias y problemas no son procesos operativos.",
                    "La disponibilidad no es un aspecto relevante en la gestión de servicios TI."
                ],
                ans: "Los SLA son parte del catálogo de servicios TI y la madurez ITSM es un concepto clave."
            },
            {
                q: "20. El rol de TI en la relación con el Negocio (4Ps) es: El proveedor, El promotor, El socio, El par?",

            },
            {
                q: "21. Gestión de Servicios TI:",
                options: [
                    "El ITSM define procesos para la prestación y soporte de servicios de TI, y la gestión se soporta en arquitectura de silos.",
                    "La mesa de servicios de TI no tiene como objetivo principal atender las solicitudes de los usuarios.",
                    "Las Aplicaciones de negocio y HW no se consideran activos de TI.",
                    "Un servicio NO es la entrega de valor al cliente."
                ],
                ans: "El ITSM define procesos para la prestación y soporte de servicios de TI, y la gestión se soporta en arquitectura de silos."
            },
            {
                q: "22. El objetivo de la evaluación de desempeño es atraer y retener a los mejores candidatos para los cargos.",
                options: ["Verdadero", "Falso"],

            },
            {
                q: "23. ¿Qué entiende por la transformación digital de una organización?",
                options: [
                    "Proceso de cambio organizacional, cultural que con apoyo de tecnologías genere agilidad y evolución empresarial",

            },
            {
                q: "24. Relacione el concepto de los Procesos de TI:",

                    "Ninguna relación es correcta."
                ],
                ans: "Eventos: Detección sucesos. Incidencias: Restablecer urgente. Problemas: Analizar causas raíz. Solicitudes: Cambios bajo costo. Accesos: Dar permisos. SLAs: Acordar niveles."
            },
            {
                q: "25. ¿Qué decisión, de las siguientes, forma parte del Gobierno de TI?",

            {

                ],

        // VARIABLES DE ESTADO
        let poolPreguntas = [];
        let preguntasIncorrectas = [];
        let indiceActual = 0;
        let puntaje = 0;
        let respondido = false;

        // ELEMENTOS DEL DOM
        const startScreen = document.getElementById('start-screen');
        const gameScreen = document.getElementById('game-screen');
        const resultScreen = document.getElementById('result-screen');
        
        const questionText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const nextBtn = document.getElementById('next-btn');
        
        const progressText = document.getElementById('progress-text');
        const scoreText = document.getElementById('score-text');
        const progressBar = document.getElementById('progress-bar');
        
        // FUNCIONES AUXILIARES
        function shuffleArray(array) {
            let curId = array.length;
            while (0 !== curId) {
                let randId = Math.floor(Math.random() * curId);
                curId -= 1;
                let tmp = array[curId];
                array[curId] = array[randId];
                array[randId] = tmp;
            }
            return array;
        }

        // LÓGICA DEL JUEGO
        function iniciarJuego(preguntas) {
            // Clonar y mezclar el arreglo de preguntas
            poolPreguntas = shuffleArray([...preguntas]);
            preguntasIncorrectas = [];
            indiceActual = 0;
            puntaje = 0;
            
            startScreen.classList.add('hidden');
            resultScreen.classList.add('hidden');
            gameScreen.classList.remove('hidden');
            gameScreen.classList.add('flex');
            
            cargarPregunta();
        }

        function practicarErrores() {
            if (preguntasIncorrectas.length === 0) return;
            iniciarJuego(preguntasIncorrectas);
        }

        function cargarPregunta() {
            respondido = false;
            nextBtn.classList.add('hidden');
            
            const pActual = poolPreguntas[indiceActual];
            
            // Actualizar UI de progreso
            progressText.innerText = `Pregunta ${indiceActual + 1} de ${poolPreguntas.length}`;
            scoreText.innerText = `Aciertos: ${puntaje}`;
            progressBar.style.width = `${((indiceActual) / poolPreguntas.length) * 100}%`;
            
            // Cargar texto
            questionText.innerText = pActual.q;
            
            // Mezclar opciones y renderizar
            const opcionesMezcladas = shuffleArray([...pActual.options]);
            optionsContainer.innerHTML = '';
            
            opcionesMezcladas.forEach(opcion => {
                const btn = document.createElement('button');
                btn.className = 'btn-option text-left p-4 rounded-xl border-2 border-gray-200 bg-white hover:border-indigo-400 hover:bg-indigo-50 font-medium text-slate-700 w-full transition-colors';
                btn.innerText = opcion;
                btn.onclick = () => seleccionarOpcion(opcion, btn);
                optionsContainer.appendChild(btn);
            });
        }

        function seleccionarOpcion(opcionElegida, btnElement) {
            if (respondido) return;
            respondido = true;
            
            const pActual = poolPreguntas[indiceActual];
            const esCorrecta = (opcionElegida === pActual.ans);
            
            const todosLosBotones = optionsContainer.querySelectorAll('button');
            
            if (esCorrecta) {
                puntaje++;
                scoreText.innerText = `Aciertos: ${puntaje}`;
                btnElement.classList.replace('border-gray-200', 'border-green-500');
                btnElement.classList.replace('bg-white', 'bg-green-100');
                btnElement.classList.replace('hover:bg-indigo-50', 'text-green-800');
            } else {
                btnElement.classList.replace('border-gray-200', 'border-red-500');
                btnElement.classList.replace('bg-white', 'bg-red-100');
                btnElement.classList.replace('hover:bg-indigo-50', 'text-red-800');
                
                // Guardar en incorrectas si no está ya
                if (!preguntasIncorrectas.includes(pActual)) {
                    preguntasIncorrectas.push(pActual);
                }
                
                // Mostrar cuál era la correcta
                todosLosBotones.forEach(b => {
                    if (b.innerText === pActual.ans) {
                        b.classList.replace('border-gray-200', 'border-green-500');
                        b.classList.replace('bg-white', 'bg-green-100');
                        b.classList.add('text-green-800');
                    }
                });
            }
            
            // Deshabilitar todos los botones
            todosLosBotones.forEach(b => {
                b.disabled = true;
                b.classList.remove('hover:border-indigo-400', 'hover:bg-indigo-50', 'btn-option');
                if(!b.classList.contains('bg-green-100') && !b.classList.contains('bg-red-100')) {
                    b.classList.add('opacity-50');
                }
            });
            
            nextBtn.classList.remove('hidden');
            progressBar.style.width = `${((indiceActual + 1) / poolPreguntas.length) * 100}%`;
        }

        function siguientePregunta() {
            indiceActual++;
            if (indiceActual < poolPreguntas.length) {
                cargarPregunta();
            } else {
                mostrarResultados();
            }
        }

        function mostrarResultados() {
            gameScreen.classList.remove('flex');
            gameScreen.classList.add('hidden');
            resultScreen.classList.remove('hidden');
            
            const porcentaje = Math.round((puntaje / poolPreguntas.length) * 100);
            const resultTitle = document.getElementById('result-title');
            const resultScore = document.getElementById('result-score');
            const resultIcon = document.getElementById('result-icon');
            const retryBtn = document.getElementById('retry-mistakes-btn');
            
            resultScore.innerHTML = `Obtuviste <b>${puntaje}</b> correctas de <b>${poolPreguntas.length}</b> (${porcentaje}%).`;
            
            if (preguntasIncorrectas.length > 0) {
                resultTitle.innerText = "¡Buen esfuerzo!";
                resultIcon.innerHTML = `<div class="bg-orange-100 p-4 rounded-full text-orange-500"><svg class="w-16 h-16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg></div>`;
                retryBtn.classList.remove('hidden');
                retryBtn.innerText = `Practicar mis ${preguntasIncorrectas.length} errores`;
            } else {
                resultTitle.innerText = "¡Excelente! Perfección.";
                resultIcon.innerHTML = `<div class="bg-green-100 p-4 rounded-full text-green-500"><svg class="w-16 h-16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4M7.835 4.697a3.42 3.42 0 001.946-.806 3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806 3.42 3.42 0 013.138 3.138 3.42 3.42 0 00.806 1.946 3.42 3.42 0 010 4.438 3.42 3.42 0 00-.806 1.946 3.42 3.42 0 01-3.138 3.138 3.42 3.42 0 00-1.946.806 3.42 3.42 0 01-4.438 0 3.42 3.42 0 00-1.946-.806 3.42 3.42 0 01-3.138-3.138 3.42 3.42 0 00-.806-1.946 3.42 3.42 0 010-4.438 3.42 3.42 0 00.806-1.946 3.42 3.42 0 013.138-3.138z"></path></svg></div>`;
                retryBtn.classList.add('hidden');
            }
        }
    </script>
