<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego de Práctica - Gestión TI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f3f4f6;
        }
        .fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .btn-option {
            transition: all 0.2s;
        }
        .btn-option:active {
            transform: scale(0.98);
        }
        /* Nuevos estilos para el modo relacionar */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-8px); }
            40% { transform: translateX(8px); }
            60% { transform: translateX(-4px); }
            80% { transform: translateX(4px); }
        }
        .shake {
            animation: shake 0.4s ease-in-out;
        }
        .card-btn {
            transition: all 0.2s;
            cursor: pointer;
        }
        .card-btn:active {
            transform: scale(0.97);
        }
        .matched {
            pointer-events: none;
            opacity: 0.8;
            transform: scale(0.95);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen flex items-center justify-center p-4 text-slate-800">

    <div id="app" class="w-full max-w-3xl bg-white rounded-2xl shadow-xl overflow-hidden relative">
        
        <!-- PANTALLA DE INICIO -->
        <div id="start-screen" class="p-8 text-center fade-in">
            <div class="mb-6 flex justify-center">
                <div class="bg-indigo-100 p-4 rounded-full text-indigo-600">
                    <svg class="w-16 h-16" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"></path></svg>
                </div>
            </div>
            <h1 class="text-3xl font-bold text-slate-800 mb-4">Simulador de Examen</h1>
            <p class="text-slate-600 mb-8">Practica las 62 preguntas de Gestión y Gobierno de TI. Las preguntas y opciones aparecerán de forma aleatoria.</p>
            <button onclick="iniciarJuego(todasLasPreguntas)" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-8 rounded-xl shadow-lg transition-colors text-lg w-full sm:w-auto">
                Comenzar Práctica
            </button>
        </div>

        <!-- PANTALLA DE JUEGO -->
        <div id="game-screen" class="hidden flex-col h-full fade-in">
            <!-- Header & Progress -->
            <div class="bg-indigo-600 p-4 text-white flex justify-between items-center shadow-md">
                <span id="progress-text" class="font-semibold">Pregunta 1 de 62</span>
                <span id="score-text" class="bg-indigo-800 px-3 py-1 rounded-lg text-sm font-bold">Aciertos: 0</span>
            </div>
            <div class="w-full bg-indigo-200 h-2">
                <div id="progress-bar" class="bg-green-400 h-2 transition-all duration-300" style="width: 0%;"></div>
            </div>

            <!-- Question Area -->
            <div class="p-6 md:p-8 flex-grow">
                <h2 id="question-text" class="text-xl md:text-2xl font-bold text-slate-800 mb-6 leading-snug">
                    ¿Pregunta?
                </h2>
                
                <p id="match-instruction" class="hidden text-sm text-indigo-600 mb-4 font-semibold bg-indigo-50 p-3 rounded-lg border border-indigo-100 text-center">
                    👆 Toca un concepto de la izquierda y luego su definición a la derecha.
                </p>
                
                <div id="options-container" class="flex flex-col space-y-3">
                    <!-- Opciones inyectadas por JS -->
                </div>
            </div>

            <!-- Footer / Next Button -->
            <div class="p-6 bg-gray-50 border-t border-gray-100 flex justify-end">
                <button id="next-btn" onclick="siguientePregunta()" class="hidden bg-slate-800 hover:bg-slate-900 text-white font-bold py-3 px-6 rounded-xl shadow transition-colors">
                    Siguiente Pregunta ➔
                </button>
            </div>
        </div>

        <!-- PANTALLA DE RESULTADOS -->
        <div id="result-screen" class="hidden p-8 text-center fade-in">
            <div id="result-icon" class="mb-6 flex justify-center">
                <!-- Icono inyectado por JS -->
            </div>
            <h2 id="result-title" class="text-3xl font-bold text-slate-800 mb-2">¡Ronda Terminada!</h2>
            <p id="result-score" class="text-xl text-slate-600 mb-8">Obtuviste X de Y correctas.</p>
            
            <div class="flex flex-col sm:flex-row justify-center space-y-3 sm:space-y-0 sm:space-x-4">
                <button id="retry-mistakes-btn" onclick="practicarErrores()" class="hidden bg-orange-500 hover:bg-orange-600 text-white font-bold py-3 px-6 rounded-xl shadow-lg transition-colors">
                    Practicar las que me equivoqué
                </button>
                <button onclick="iniciarJuego(todasLasPreguntas)" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-6 rounded-xl shadow-lg transition-colors">
                    Reiniciar todo
                </button>
            </div>
        </div>

    </div>

        // VARIABLES DE ESTADO
        let poolPreguntas = [];
        let preguntasIncorrectas = [];

        let matchLeftId = null;
        let matchRightId = null;
        let matchesFound = 0;

        const matchPalette = [
            'bg-green-100 text-green-900 border-green-300',

            'bg-purple-100 text-purple-900 border-purple-300',

            'bg-orange-100 text-orange-900 border-orange-300'
        ];

        // Variables específicas para modo multiple
        let opcionesSeleccionadasMulti = [];

        // ELEMENTOS DEL DOM
        const startScreen = document.getElementById('start-screen');
        const gameScreen = document.getElementById('game-screen');
        const resultScreen = document.getElementById('result-screen');
        
        const questionText = document.getElementById('question-text');
        const matchInstruction = document.getElementById('match-instruction');
        const optionsContainer = document.getElementById('options-container');
        const nextBtn = document.getElementById('next-btn');
        
        const progressText = document.getElementById('progress-text');
        const scoreText = document.getElementById('score-text');
        const progressBar = document.getElementById('progress-bar');
        
        // FUNCIONES AUXILIARES
        function shuffleArray(array) {
            let curId = array.length;
            while (0 !== curId) {
                let randId = Math.floor(Math.random() * curId);
                curId -= 1;
                let tmp = array[curId];
                array[curId] = array[randId];
                array[randId] = tmp;
            }
            return array;
        }

        // LÓGICA DEL JUEGO
        function iniciarJuego(preguntas) {
            // Clonar y mezclar el arreglo de preguntas
            poolPreguntas = shuffleArray([...preguntas]);
            preguntasIncorrectas = [];
            indiceActual = 0;
            puntaje = 0;
            
            startScreen.classList.add('hidden');
            resultScreen.classList.add('hidden');
            gameScreen.classList.remove('hidden');
            gameScreen.classList.add('flex');
            
            cargarPregunta();
        }

        function practicarErrores() {
            if (preguntasIncorrectas.length === 0) return;
            iniciarJuego(preguntasIncorrectas);
        }

        function cargarPregunta() {
            respondido = false;
            nextBtn.classList.add('hidden');
            matchInstruction.classList.add('hidden');
            
            const pActual = poolPreguntas[indiceActual];
            
            // Actualizar UI de progreso
            progressText.innerText = `Pregunta ${indiceActual + 1} de ${poolPreguntas.length}`;
            scoreText.innerText = `Aciertos: ${puntaje}`;
            progressBar.style.width = `${((indiceActual) / poolPreguntas.length) * 100}%`;
            
            // Cargar texto
            questionText.innerText = pActual.q;
            optionsContainer.innerHTML = '';
            opcionesSeleccionadasMulti = []; // Limpiar para nueva pregunta

            if (pActual.type === 'match') {
                renderMatchQuestion(pActual);
            } else if (pActual.type === 'multiple') {
                renderMultipleQuestion(pActual);
            } else {
                renderChoiceQuestion(pActual);
            }
        }

        function renderChoiceQuestion(pActual) {
            optionsContainer.className = "flex flex-col space-y-3";
            const opcionesMezcladas = shuffleArray([...pActual.options]);
            
            opcionesMezcladas.forEach(opcion => {
                const btn = document.createElement('button');
                btn.className = 'btn-option text-left p-4 rounded-xl border-2 border-gray-200 bg-white hover:border-indigo-400 hover:bg-indigo-50 font-medium text-slate-700 w-full transition-colors';
                btn.innerText = opcion;
                btn.onclick = () => seleccionarOpcion(opcion, btn);
                optionsContainer.appendChild(btn);
            });
        }

        function renderMultipleQuestion(pActual) {
            matchInstruction.innerText = "👆 Selecciona TODAS las opciones correctas y luego presiona Confirmar.";
            matchInstruction.classList.remove('hidden');
            optionsContainer.className = "flex flex-col space-y-3";
            
            const opcionesMezcladas = shuffleArray([...pActual.options]);
            
            opcionesMezcladas.forEach(opcion => {
                const btn = document.createElement('button');
                btn.className = 'btn-option text-left p-4 rounded-xl border-2 border-gray-200 bg-white hover:border-indigo-400 hover:bg-indigo-50 font-medium text-slate-700 w-full transition-colors relative pl-12';
                
                // Cuadrito para parecer checkbox
                const checkbox = document.createElement('div');
                checkbox.className = 'absolute left-4 top-1/2 transform -translate-y-1/2 w-5 h-5 border-2 border-gray-300 rounded flex items-center justify-center pointer-events-none transition-colors';
                btn.appendChild(checkbox);
                
                const textSpan = document.createElement('span');
                textSpan.innerText = opcion;
                btn.appendChild(textSpan);

                btn.onclick = () => toggleOpcionMultiple(opcion, btn, checkbox);
                optionsContainer.appendChild(btn);
            });

            // Botón confirmar
            const confirmBtn = document.createElement('button');
            confirmBtn.id = 'confirm-multi-btn';
            confirmBtn.className = 'mt-4 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-6 rounded-xl shadow transition-colors w-full';
            confirmBtn.innerText = "Confirmar Selección";
            confirmBtn.onclick = () => evaluarMultiple(pActual);
            optionsContainer.appendChild(confirmBtn);
        }

        function toggleOpcionMultiple(opcion, btn, checkbox) {
            if (respondido) return;
            const index = opcionesSeleccionadasMulti.indexOf(opcion);
            
            // Restablecer estilos de error si es que hubo antes
            matchInstruction.innerText = "👆 Selecciona TODAS las opciones correctas y luego presiona Confirmar.";
            matchInstruction.classList.remove('text-red-600', 'bg-red-50', 'border-red-100');
            matchInstruction.classList.add('text-indigo-600', 'bg-indigo-50', 'border-indigo-100');
            
            if (index > -1) {
                // Deseleccionar
                opcionesSeleccionadasMulti.splice(index, 1);
                btn.classList.remove('border-indigo-500', 'bg-indigo-50');
                btn.classList.add('border-gray-200', 'bg-white');
                checkbox.classList.remove('bg-indigo-500', 'border-indigo-500');
                checkbox.innerHTML = '';
            } else {
                // Seleccionar
                opcionesSeleccionadasMulti.push(opcion);
                btn.classList.remove('border-gray-200', 'bg-white');
                btn.classList.add('border-indigo-500', 'bg-indigo-50');
                checkbox.classList.add('bg-indigo-500', 'border-indigo-500');
                checkbox.innerHTML = '<svg class="w-3 h-3 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>';
            }
        }

        function evaluarMultiple(pActual) {
            if (respondido) return;
            if (opcionesSeleccionadasMulti.length === 0) {
                matchInstruction.innerText = "⚠️ Debes seleccionar al menos una opción para confirmar.";
                matchInstruction.classList.replace('text-indigo-600', 'text-red-600');
                matchInstruction.classList.replace('bg-indigo-50', 'bg-red-50');
                matchInstruction.classList.replace('border-indigo-100', 'border-red-100');
                return;
            }
            respondido = true;
            
            // Check if correct
            const correctas = pActual.ans; 
            let esCorrecta = true;
            
            if (opcionesSeleccionadasMulti.length !== correctas.length) {
                esCorrecta = false;
            } else {
                for (let opt of opcionesSeleccionadasMulti) {
                    if (!correctas.includes(opt)) {
                        esCorrecta = false;
                        break;
                    }
                }
            }
            
            const todosLosBotones = optionsContainer.querySelectorAll('.btn-option');
            const confirmBtn = document.getElementById('confirm-multi-btn');
            if (confirmBtn) confirmBtn.classList.add('hidden'); // Ocultar boton confirmar
            
            if (esCorrecta) {
                puntaje++;
                scoreText.innerText = `Aciertos: ${puntaje}`;
            } else {
                if (!preguntasIncorrectas.includes(pActual)) {
                    preguntasIncorrectas.push(pActual);
                }
            }
            
            todosLosBotones.forEach(b => {
                b.disabled = true;
                b.classList.remove('hover:border-indigo-400', 'hover:bg-indigo-50', 'btn-option', 'cursor-pointer');
                
                const textoOpcion = b.querySelector('span').innerText;
                const esParteDeCorrectas = correctas.includes(textoOpcion);
                const fueSeleccionada = opcionesSeleccionadasMulti.includes(textoOpcion);
                const checkbox = b.querySelector('div');
                
                if (esParteDeCorrectas) {
                    // Es correcta (la marcamos verde, independientemente de si el usuario la seleccionó o se olvidó)
                    b.classList.remove('border-gray-200', 'border-indigo-500', 'bg-white', 'bg-indigo-50');
                    b.classList.add('border-green-500', 'bg-green-100', 'text-green-800');
                    checkbox.classList.add('bg-green-500', 'border-green-500');
                    checkbox.innerHTML = '<svg class="w-3 h-3 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>';
                } else if (fueSeleccionada && !esParteDeCorrectas) {
                    // La eligió pero era incorrecta
                    b.classList.remove('border-indigo-500', 'bg-indigo-50');
                    b.classList.add('border-red-500', 'bg-red-100', 'text-red-800');
                    checkbox.classList.remove('bg-indigo-500', 'border-indigo-500');
                    checkbox.classList.add('bg-red-500', 'border-red-500');
                    checkbox.innerHTML = '<svg class="w-3 h-3 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M6 18L18 6M6 6l12 12"></path></svg>';
                } else {
                    // No es correcta y no la seleccionó (ignorar)
                    b.classList.add('opacity-50');
                }
            });
            
            nextBtn.classList.remove('hidden');
            progressBar.style.width = `${((indiceActual + 1) / poolPreguntas.length) * 100}%`;
        }

        function renderMatchQuestion(pActual) {
            matchInstruction.classList.remove('hidden');
            optionsContainer.className = "grid grid-cols-1 md:grid-cols-2 gap-4 mt-4";
            
            // Reiniciar estado match
            matchLeftId = null;
            matchRightId = null;
            matchesFound = 0;
            matchFailedOnce = false;
            matchColorIndex = 0;

            const leftItems = shuffleArray(pActual.pairs.map(p => ({ id: p.id, text: p.left })));
            const rightItems = shuffleArray(pActual.pairs.map(p => ({ id: p.id, text: p.right })));

            const leftCol = document.createElement('div');
            leftCol.className = "flex flex-col space-y-2";
            
            const rightCol = document.createElement('div');
            rightCol.className = "flex flex-col space-y-2";

            leftItems.forEach(item => {
                const btn = document.createElement('div');
                btn.className = `card-btn p-3 rounded-lg border-2 border-slate-200 bg-white text-sm font-medium text-slate-700 flex items-center min-h-[4rem]`;
                btn.id = `left-${item.id}`;
                btn.innerText = item.text;
                btn.onclick = () => seleccionarMatch('left', item.id, btn, pActual);
                leftCol.appendChild(btn);
            });

            rightItems.forEach(item => {
                const btn = document.createElement('div');
                btn.className = `card-btn p-3 rounded-lg border-2 border-slate-200 bg-white text-sm font-medium text-slate-700 flex items-center min-h-[4rem]`;
                btn.id = `right-${item.id}`;
                btn.innerText = item.text;
                btn.onclick = () => seleccionarMatch('right', item.id, btn, pActual);
                rightCol.appendChild(btn);
            });

            optionsContainer.appendChild(leftCol);
            optionsContainer.appendChild(rightCol);
        }

        function seleccionarMatch(columna, id, elementoHTML, pActual) {
            if (elementoHTML.classList.contains('matched')) return;

            if (columna === 'left') {
                if (matchLeftId) {
                    document.getElementById(`left-${matchLeftId}`).classList.remove('ring-4', 'ring-indigo-400', 'border-indigo-400');
                }
                if (matchLeftId === id) {
                    matchLeftId = null;
                    return;
                }
                matchLeftId = id;
                elementoHTML.classList.add('ring-4', 'ring-indigo-400', 'border-indigo-400');
            } else {
                if (matchRightId) {
                    document.getElementById(`right-${matchRightId}`).classList.remove('ring-4', 'ring-indigo-400', 'border-indigo-400');
                }
                if (matchRightId === id) {
                    matchRightId = null;
                    return;
                }
                matchRightId = id;
                elementoHTML.classList.add('ring-4', 'ring-indigo-400', 'border-indigo-400');
            }

            if (matchLeftId && matchRightId) {
                comprobarMatch(pActual);
            }
        }

        function comprobarMatch(pActual) {
            const btnLeft = document.getElementById(`left-${matchLeftId}`);
            const btnRight = document.getElementById(`right-${matchRightId}`);

            if (matchLeftId === matchRightId) {
                // Éxito
                matchesFound++;
                const colorClases = matchPalette[matchColorIndex % matchPalette.length].split(' ');
                
                [btnLeft, btnRight].forEach(btn => {
                    btn.classList.remove('ring-4', 'ring-indigo-400', 'border-indigo-400', 'bg-white', 'text-slate-700', 'border-slate-200');
                    btn.classList.add('matched', 'shadow-none', ...colorClases);
                    const check = document.createElement('span');
                    check.innerHTML = '✔';
                    check.className = 'ml-auto font-bold opacity-75 pl-2';
                    btn.appendChild(check);
                });

                matchColorIndex++;

                if (matchesFound === pActual.pairs.length) {
                    respondido = true;
                    if (!matchFailedOnce) {
                        puntaje++;
                        scoreText.innerText = `Aciertos: ${puntaje}`;
                    }
                    nextBtn.classList.remove('hidden');
                    progressBar.style.width = `${((indiceActual + 1) / poolPreguntas.length) * 100}%`;
                }
            } else {
                // Error
                matchFailedOnce = true;
                if (!preguntasIncorrectas.includes(pActual)) {
                    preguntasIncorrectas.push(pActual);
                }

                [btnLeft, btnRight].forEach(btn => {
                    btn.classList.remove('ring-4', 'ring-indigo-400', 'border-indigo-400');
                    btn.classList.add('bg-red-50', 'border-red-400', 'text-red-700', 'shake');
                    
                    setTimeout(() => {
                        btn.classList.remove('bg-red-50', 'border-red-400', 'text-red-700', 'shake');
                        btn.classList.add('bg-white', 'border-slate-200', 'text-slate-700');
                    }, 500);
                });
            }

            matchLeftId = null;
            matchRightId = null;
        }

        function seleccionarOpcion(opcionElegida, btnElement) {
            if (respondido) return;
            respondido = true;
            
            const pActual = poolPreguntas[indiceActual];
            const esCorrecta = (opcionElegida === pActual.ans);
            
            const todosLosBotones = optionsContainer.querySelectorAll('button');
            
            if (esCorrecta) {
                puntaje++;
                scoreText.innerText = `Aciertos: ${puntaje}`;
                btnElement.classList.replace('border-gray-200', 'border-green-500');
                btnElement.classList.replace('bg-white', 'bg-green-100');
                btnElement.classList.replace('hover:bg-indigo-50', 'text-green-800');
            } else {
                btnElement.classList.replace('border-gray-200', 'border-red-500');
                btnElement.classList.replace('bg-white', 'bg-red-100');
                btnElement.classList.replace('hover:bg-indigo-50', 'text-red-800');
                
                // Guardar en incorrectas si no está ya
                if (!preguntasIncorrectas.includes(pActual)) {
                    preguntasIncorrectas.push(pActual);
                }
                
                // Mostrar cuál era la correcta
                todosLosBotones.forEach(b => {
                    if (b.innerText === pActual.ans) {
                        b.classList.replace('border-gray-200', 'border-green-500');
                        b.classList.replace('bg-white', 'bg-green-100');
                        b.classList.add('text-green-800');
                    }
                });
            }
            
            // Deshabilitar todos los botones
            todosLosBotones.forEach(b => {
                b.disabled = true;
                b.classList.remove('hover:border-indigo-400', 'hover:bg-indigo-50', 'btn-option');
                if(!b.classList.contains('bg-green-100') && !b.classList.contains('bg-red-100')) {
                    b.classList.add('opacity-50');
                }
            });
            
            nextBtn.classList.remove('hidden');
            progressBar.style.width = `${((indiceActual + 1) / poolPreguntas.length) * 100}%`;
        }

        function siguientePregunta() {
            indiceActual++;
            if (indiceActual < poolPreguntas.length) {
                cargarPregunta();
            } else {
                mostrarResultados();
            }
        }

        function mostrarResultados() {
            gameScreen.classList.remove('flex');
            gameScreen.classList.add('hidden');
            resultScreen.classList.remove('hidden');
            
            const porcentaje = Math.round((puntaje / poolPreguntas.length) * 100);
            const resultTitle = document.getElementById('result-title');
            const resultScore = document.getElementById('result-score');
            const resultIcon = document.getElementById('result-icon');
            const retryBtn = document.getElementById('retry-mistakes-btn');
            
            resultScore.innerHTML = `Obtuviste <b>${puntaje}</b> correctas de <b>${poolPreguntas.length}</b> (${porcentaje}%).`;
            
            if (preguntasIncorrectas.length > 0) {
                resultTitle.innerText = "¡Buen esfuerzo!";
                resultIcon.innerHTML = `<div class="bg-orange-100 p-4 rounded-full text-orange-500"><svg class="w-16 h-16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg></div>`;
                retryBtn.classList.remove('hidden');
                retryBtn.innerText = `Practicar mis ${preguntasIncorrectas.length} errores`;
            } else {
                resultTitle.innerText = "¡Excelente! Perfección.";
                resultIcon.innerHTML = `<div class="bg-green-100 p-4 rounded-full text-green-500"><svg class="w-16 h-16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4M7.835 4.697a3.42 3.42 0 001.946-.806 3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806 3.42 3.42 0 013.138 3.138 3.42 3.42 0 00.806 1.946 3.42 3.42 0 010 4.438 3.42 3.42 0 00-.806 1.946 3.42 3.42 0 01-3.138 3.138 3.42 3.42 0 00-1.946.806 3.42 3.42 0 01-4.438 0 3.42 3.42 0 00-1.946-.806 3.42 3.42 0 01-3.138-3.138 3.42 3.42 0 00-.806-1.946 3.42 3.42 0 010-4.438 3.42 3.42 0 00.806-1.946 3.42 3.42 0 013.138-3.138z"></path></svg></div>`;
                retryBtn.classList.add('hidden');
            }
        }
    </script>
</body>
